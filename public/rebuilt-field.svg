  <line x1="310" y1="91" x2="310" y2="99" stroke="#1d4ed8" stroke-width="3"/>

  <!-- Blue Loading Bay / Corral with yellow power cells (Top Right) -->
  <rect x="325" y="42" width="60" height="42" fill="#090c15" stroke="#1d4ed8" stroke-width="3"/>
